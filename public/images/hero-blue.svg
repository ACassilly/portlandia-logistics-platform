<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1600" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1117" />
      <stop offset="0.55" stop-color="#16314A" />
      <stop offset="1" stop-color="#2B6CB0" />
    </linearGradient>
    <linearGradient id="field" x1="0" y1="560" x2="0" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1C5A37" />
      <stop offset="1" stop-color="#0D2A1C" />
    </linearGradient>
    <filter id="softShadow" x="-40" y="-40" width="1680" height="980" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="18" />
    </filter>
  </defs>

  <rect width="1600" height="900" rx="36" fill="url(#sky)" />
  <rect y="540" width="1600" height="360" fill="url(#field)" />

  <!-- distant tree line -->
  <path d="M0 560C180 520 330 528 520 552C730 578 900 592 1120 566C1320 542 1450 510 1600 488V560H0Z" fill="#0E1E2B" opacity="0.45"/>

  <!-- truck silhouette -->
  <g opacity="0.92" transform="translate(680 330)">
    <rect x="0" y="140" width="520" height="160" rx="18" fill="#0B151D"/>
    <rect x="330" y="80" width="190" height="220" rx="18" fill="#081017"/>
    <rect x="350" y="106" width="70" height="52" rx="10" fill="#1E3B55"/>
    <rect x="430" y="106" width="70" height="52" rx="10" fill="#1E3B55"/>
    <circle cx="140" cy="320" r="36" fill="#0A0F14"/>
    <circle cx="140" cy="320" r="16" fill="#2B3238"/>
    <circle cx="420" cy="320" r="36" fill="#0A0F14"/>
    <circle cx="420" cy="320" r="16" fill="#2B3238"/>
    <rect x="50" y="170" width="250" height="18" rx="9" fill="#00C950" opacity="0.8"/>
  </g>

  <!-- vignette -->
  <g filter="url(#softShadow)" opacity="0.55">
    <path d="M-80 -40H1680V980H-80V-40Z" fill="#000000"/>
  </g>
  <rect width="1600" height="900" rx="36" fill="#000000" opacity="0.12"/>
</svg>

